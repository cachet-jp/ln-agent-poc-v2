# === Docker Compose Override ===
# Overrides for external access and debugging
# Place alongside docker-compose.yml on EC2

version: '3.8'

services:
  openclaw:
    # Override to bind to all interfaces (for SSH tunnel access)
    environment:
      - OPENCLAW_GATEWAY_HOST=0.0.0.0
      - OPENCLAW_GATEWAY_PORT=18789
      - OPENCLAW_ADMIN_HOST=0.0.0.0
      - OPENCLAW_ADMIN_PORT=8081
    ports:
      - "18789:18789"  # WebSocket gateway (via SSH tunnel only)
      - "8081:8081"    # Health/admin (via SSH tunnel only)
