name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks-action requires a paid license for GitHub organizations.
      # The gitleaks CLI itself is free (MIT) — run the pinned binary directly.
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: purchasing-agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: purchasing-agent/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      # Surface known-vulnerable dependencies. Non-blocking for now: some highs
      # are transitive through @modelcontextprotocol/sdk and off our runtime
      # path; Dependabot opens the bumps. Tighten to a gate once clean.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
